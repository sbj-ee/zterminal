# Publish a release when a v* tag is pushed (e.g. `git push origin v1.0.0`):
# build + test on Ubuntu 24.04 and macOS 14, package .deb + .dmg, write
# SHA256SUMS (lists both assets so the Linux updater still finds its .deb line),
# sign it with minisign (SHA256SUMS.minisig) and create the GitHub Release.
#
# In-app updater:
#   Linux: downloads SHA256SUMS + .minisig (signature checked) + zterminal_<version>_amd64.deb,
#          pkexec apt install
#   macOS: downloads SHA256SUMS + .minisig + zterminal-<version>-Darwin.dmg, opens the .dmg
#          for a drag-to-Applications install (no automated replace).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # gh release create

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Build Linux ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt 6 + build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-qpa-plugins libgl1-mesa-dev cmake ninja-build g++ dpkg-dev fonts-dejavu-core \
            xvfb xauth dbus qt6-serialport-dev socat libsodium-dev pkg-config

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Tag must match project() VERSION
        run: |
          version=$(sed -n 's/.*CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$GITHUB_REF_NAME project=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project(zterminal VERSION $version) in CMakeLists.txt"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          deb="zterminal_${VERSION}_amd64.deb"
          test -f "$deb"
          dpkg-deb -I "$deb"
          dpkg-deb -c "$deb" | grep -q './usr/bin/zterminal$'
          sha256sum "$deb" > SHA256SUMS.linux
          cat SHA256SUMS.linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zterminal-release-linux
          path: |
            build/zterminal_*_amd64.deb
            build/SHA256SUMS.linux
          if-no-files-found: error

  macos:
    name: Build macOS ${{ github.ref_name }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt + build tools (brew)
        run: brew install qt cmake ninja libsodium pkg-config socat

      - name: Configure arm64
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0

      - name: Tag must match project() VERSION
        run: |
          version=$(sed -n 's/.*CMAKE_PROJECT_VERSION:STATIC=//p' build/CMakeCache.txt)
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$GITHUB_REF_NAME project=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project(zterminal VERSION $version) in CMakeLists.txt"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package .dmg
        run: |
          cd build
          cpack -G DragNDrop
          dmg="zterminal-${VERSION}-Darwin.dmg"
          test -f "$dmg"
          shasum -a 256 "$dmg" | sed 's/  /  /' > SHA256SUMS.macos
          cat SHA256SUMS.macos

      - name: Verify .dmg
        run: |
          set -euo pipefail
          dmg=$(ls build/zterminal-*-Darwin.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          test -d "$mnt/zterminal.app"
          tools/macos/check-bundle.sh "$mnt/zterminal.app"
          codesign --verify --deep --strict --verbose=2 "$mnt/zterminal.app"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zterminal-release-macos
          path: |
            build/zterminal-*-Darwin.dmg
            build/SHA256SUMS.macos
          if-no-files-found: error

  publish:
    name: Publish ${{ github.ref_name }}
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Assemble and sign SHA256SUMS, create release
        env:
          GH_TOKEN: ${{ github.token }}
          # minisign secret key (the whole minisign.key file) and its password;
          # see docs/RELEASING.md. The release fails without them.
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          cp dist/zterminal-release-linux/zterminal_${version}_amd64.deb out/
          cp dist/zterminal-release-macos/zterminal-${version}-Darwin.dmg out/
          # Combined checksums: Linux updater greps for its .deb line; macOS for .dmg.
          {
            cat dist/zterminal-release-linux/SHA256SUMS.linux
            cat dist/zterminal-release-macos/SHA256SUMS.macos
          } > out/SHA256SUMS
          cat out/SHA256SUMS
          (cd out && sha256sum -c SHA256SUMS)

          # Sign SHA256SUMS. The app installs nothing without a valid
          # SHA256SUMS.minisig from the key compiled into it.
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::error::Secret MINISIGN_SECRET_KEY is not set: refusing to publish an unsigned release (see docs/RELEASING.md)"
            exit 1
          fi
          sudo apt-get install -y -qq minisign
          key="$RUNNER_TEMP/minisign.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "${MINISIGN_PASSWORD:-}" \
            | minisign -S -s "$key" -m out/SHA256SUMS -t "zterminal $GITHUB_REF_NAME SHA256SUMS"
          rm -f "$key"
          # Check it against the public key compiled into this commit, so a
          # release the app can't verify never goes out.
          pub=$(gh api "repos/$GITHUB_REPOSITORY/contents/core/UpdateSigningKey.cpp?ref=$GITHUB_SHA" \
                  -H "Accept: application/vnd.github.raw" \
                | sed -n 's/.*kUpdateSigningPublicKey\[\] = "\(RW[A-Za-z0-9+/=]*\)".*/\1/p')
          if [ -z "$pub" ]; then
            echo "::error::core/UpdateSigningKey.cpp has no public key yet: paste the minisign public key first (docs/RELEASING.md)"
            exit 1
          fi
          minisign -V -P "$pub" -m out/SHA256SUMS -x out/SHA256SUMS.minisig

          gh release create "$GITHUB_REF_NAME" \
            "out/zterminal_${version}_amd64.deb" \
            "out/zterminal-${version}-Darwin.dmg" \
            out/SHA256SUMS \
            out/SHA256SUMS.minisig \
            --repo "$GITHUB_REPOSITORY" \
            --title "zterminal $version" \
            --generate-notes \
            --verify-tag
