# Build, test and package zterminal on Ubuntu 24.04 (Linux amd64 only).
# Version comes from CMake project() -> PROJECT_VERSION; the .deb is
# zterminal_<version>_amd64.deb.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Qt 6 + build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-qpa-plugins libgl1-mesa-dev cmake ninja-build g++ dpkg-dev fonts-dejavu-core \
            xvfb xauth dbus qt6-serialport-dev socat

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: |
          # The global-menu regression test must actually be built and run here.
          ctest --test-dir build -N | grep -q tst_globalmenu
          ctest --test-dir build --output-on-failure
          ctest --test-dir build -R tst_globalmenu -V | grep -E 'PASS|SKIP|FAIL|Totals'
          # The serial tests need socat: they must run, not skip.
          ctest --test-dir build -R 'tst_serial' -V | tee serial.log | grep -E 'PASS|SKIP|FAIL|Totals'
          ! grep -q 'SKIP ' serial.log

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          ls -l *.deb
          dpkg-deb -I zterminal_*_amd64.deb
          dpkg-deb -c zterminal_*_amd64.deb
          dpkg-deb -c zterminal_*_amd64.deb | grep -q './usr/bin/zt$'
          dpkg-deb -c zterminal_*_amd64.deb | grep -q './usr/bin/zterminal$'
          dpkg-deb -f zterminal_*_amd64.deb Depends | grep -q 'libqt6serialport6'

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: zterminal-deb
          path: build/zterminal_*_amd64.deb
          if-no-files-found: error
