# Build, test and package zterminal on Ubuntu 24.04 (Linux amd64) and
# macOS 14 (Apple Silicon). Version comes from CMake project() ->
# PROJECT_VERSION; artifacts are zterminal_<version>_amd64.deb and
# zterminal-<version>-Darwin.dmg.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt 6 + build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-qpa-plugins libgl1-mesa-dev cmake ninja-build g++ dpkg-dev fonts-dejavu-core \
            xvfb xauth dbus qt6-serialport-dev socat libsodium-dev pkg-config

      # ZTERMINAL_WERROR: a new compiler warning fails CI (off for local builds).
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DZTERMINAL_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: |
          # The global-menu regression test must actually be built and run here.
          ctest --test-dir build -N | grep -q tst_globalmenu
          ctest --test-dir build --output-on-failure
          ctest --test-dir build -R tst_globalmenu -V | grep -E 'PASS|SKIP|FAIL|Totals'
          # The serial tests need socat: they must run, not skip.
          ctest --test-dir build -R 'tst_serial' -V | tee serial.log | grep -E 'PASS|SKIP|FAIL|Totals'
          ! grep -q 'SKIP ' serial.log
          # The shared-vault regression test (0.7.1) must be built and run.
          ctest --test-dir build -N | grep -q tst_vaultshared
          # Vault (incl. tst_vaultshared), askpass, logging, tabs, Find/scrollback, reconnect and update suites (Send Stored Login also needs socat): must run, not skip.
          ctest --test-dir build -R 'tst_vault|tst_askpass|tst_sessionlog|tst_logui|tst_pasteguard|tst_safepaste|tst_tabs|tst_scrollback|tst_find|tst_scrollbench|tst_reconnect|tst_update' -V | tee vault.log | grep -E 'PASS|SKIP|FAIL|Totals|production KDF|BENCH'
          ! grep -q 'SKIP ' vault.log

      - name: Package .deb
        run: |
          cd build
          cpack -G DEB
          ls -l *.deb
          dpkg-deb -I zterminal_*_amd64.deb
          dpkg-deb -c zterminal_*_amd64.deb
          dpkg-deb -c zterminal_*_amd64.deb | grep -q './usr/bin/zt$'
          dpkg-deb -c zterminal_*_amd64.deb | grep -q './usr/bin/zterminal$'
          dpkg-deb -f zterminal_*_amd64.deb Depends | grep -q 'libqt6serialport6'
          dpkg-deb -f zterminal_*_amd64.deb Depends | grep -q 'libsodium23'
          dpkg-deb -f zterminal_*_amd64.deb Depends | grep -q 'libqt6network6'
          dpkg-deb -f zterminal_*_amd64.deb Recommends | grep -q 'pkexec'
          dpkg-deb -c zterminal_*_amd64.deb | grep -q './usr/libexec/zterminal/zterminal-askpass$'

      - name: Upload .deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zterminal-deb
          path: build/zterminal_*_amd64.deb
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt + build tools (brew)
        run: |
          brew install qt cmake ninja libsodium pkg-config socat
          # Homebrew's `qt` formula ships QtSerialPort; confirm for the log.
          ls "$(brew --prefix qt)/lib" | grep -i SerialPort || \
            ls "$(brew --prefix qt)/lib/cmake" | grep -i SerialPort

      - name: Configure arm64
        run: |
          # CMAKE_OSX_ARCHITECTURES=arm64 is also forced in CMakeLists before project()
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DZTERMINAL_WERROR=ON \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0

      - name: Build
        run: cmake --build build

      - name: Test
        run: |
          set -euo pipefail
          # Linux-only: tst_globalmenu needs xvfb + DBus AppMenu; skip expectation here.
          if ctest --test-dir build -N | grep -q tst_globalmenu; then
            echo "::error::tst_globalmenu should not be built on macOS"
            exit 1
          fi
          ctest --test-dir build --output-on-failure
          # Serial via socat must run, not skip.
          ctest --test-dir build -R 'tst_serial' -V | tee serial.log | grep -E 'PASS|SKIP|FAIL|Totals'
          ! grep -q 'SKIP ' serial.log
          ctest --test-dir build -N | grep -q tst_vaultshared
          ctest --test-dir build -R 'tst_vault|tst_askpass|tst_sessionlog|tst_logui|tst_pasteguard|tst_safepaste|tst_tabs|tst_scrollback|tst_find|tst_scrollbench|tst_reconnect|tst_update' -V | tee vault.log | grep -E 'PASS|SKIP|FAIL|Totals|production KDF|BENCH'
          ! grep -q 'SKIP ' vault.log

      - name: Package .dmg (zterminal.app, macdeployqt, ad-hoc sign)
        run: |
          cd build
          cpack -G DragNDrop
          ls -la *.dmg

      - name: Verify .dmg contents (no Homebrew references, signature)
        run: |
          set -euo pipefail
          dmg=$(ls build/zterminal-*-Darwin.dmg)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          trap 'hdiutil detach "$mnt" -quiet || true' EXIT
          ls -la "$mnt"
          test -d "$mnt/zterminal.app"
          test -L "$mnt/Applications"
          plutil -p "$mnt/zterminal.app/Contents/Info.plist"
          file "$mnt/zterminal.app/Contents/MacOS/zterminal" | tee /tmp/zt-arch.txt
          grep -q 'arm64' /tmp/zt-arch.txt
          test -x "$mnt/zterminal.app/Contents/MacOS/zterminal-askpass"
          tools/macos/check-bundle.sh "$mnt/zterminal.app"
          codesign --verify --deep --strict --verbose=2 "$mnt/zterminal.app"
          codesign -dv --verbose=4 "$mnt/zterminal.app" 2>&1 | tee /tmp/zt-sig.txt | grep -E "Identifier|Signature|Format|flags|TeamIdentifier"
          # Ad-hoc releases must NOT use hardened runtime: library validation
          # then rejects nested Qt frameworks (empty Team IDs → "different Team
          # IDs" crash). check-bundle.sh also enforces this.
          grep -qi 'Signature=adhoc' /tmp/zt-sig.txt
          ! grep -Eq 'flags=[^ ]*runtime' /tmp/zt-sig.txt
          # Launch smoke test: bundled Qt (incl. QtSerialPort) must load.
          "$mnt/zterminal.app/Contents/MacOS/zterminal" --version
          "$mnt/zterminal.app/Contents/MacOS/zterminal" > /tmp/zt-run.log 2>&1 &
          pid=$!
          sleep 8
          if ! kill -0 "$pid" 2>/dev/null; then
            cat /tmp/zt-run.log
            echo "::error::zterminal.app exited at launch (codesign / library validation?)"
            exit 1
          fi
          kill "$pid" || true

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zterminal-macos-arm64-dmg
          path: build/zterminal-*-Darwin.dmg
          if-no-files-found: error

  sanitizers:
    name: Sanitizers (ASan + UBSan, ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt 6 + build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev qt6-qpa-plugins libgl1-mesa-dev cmake ninja-build g++ fonts-dejavu-core \
            xvfb xauth dbus qt6-serialport-dev socat libsodium-dev pkg-config

      - name: Configure (RelWithDebInfo, -fsanitize=address,undefined)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DZTERMINAL_SANITIZE=address,undefined

      - name: Build
        run: cmake --build build

      - name: Test under ASan/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tools/sanitizers/lsan.supp:print_suppressions=0
        run: ctest --test-dir build --output-on-failure

  clang-tidy:
    name: clang-tidy (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt 6 + clang-tidy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev libgl1-mesa-dev cmake ninja-build clang clang-tidy qt6-serialport-dev libsodium-dev pkg-config
          clang-tidy --version

      - name: Configure (clang, compile_commands.json)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DZTERMINAL_BUILD_TESTS=OFF

      # The analysis needs the generated headers (moc output, version.hpp).
      - name: Build
        run: cmake --build build

      # Checks and suppressions are in .clang-tidy; any finding fails the job.
      - name: Run clang-tidy on core/, app/ and askpass/
        run: run-clang-tidy -quiet -p build "$PWD/(core|app|askpass)/.*\.(cpp|c)$"

  fuzz:
    name: Fuzz (libFuzzer, 60 s per harness)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Qt 6 + clang
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            qt6-base-dev libgl1-mesa-dev cmake ninja-build clang qt6-serialport-dev libsodium-dev pkg-config

      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DZTERMINAL_FUZZ=ON -DZTERMINAL_BUILD_TESTS=OFF

      - name: Build harnesses
        run: cmake --build build --target fuzz_vault fuzz_session_import fuzz_terminal fuzz_paste_title fuzz_update_json

      - name: Run each harness for 60 s
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          mkdir -p crashes
          for h in vault session_import terminal paste_title update_json; do
            echo "::group::fuzz_$h"
            work="$RUNNER_TEMP/corpus-$h"
            cp -r "fuzz/corpus/$h" "$work"
            build/fuzz/fuzz_$h -max_total_time=60 -rss_limit_mb=2048 -timeout=10 \
              -artifact_prefix="crashes/$h-" -print_final_stats=1 "$work"
            echo "::endgroup::"
          done

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: crashes/
          if-no-files-found: ignore
