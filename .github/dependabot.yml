# Keep the SHA-pinned GitHub Actions current (Dependabot updates the SHA and
# the version comment together).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Minor and patch updates arrive together in one PR, which merges itself
    # once CI passes (dependabot-auto-merge.yml). A major update gets a PR of
    # its own and waits for review.
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "ci"
